subject: Небольшой грузовик с кабиной и закрытым грузовым кузовом.
purpose: Выбрать крупные массы грузовика перед процедурной сборкой игрового ассета.
question: Различимы ли кабина, грузовой кузов и опора на колёса без окон и деталей?
pass: cube_massing
masses:
- Кабина — один прямоугольный блок спереди, ниже и короче грузового кузова.
- Закрытый грузовой кузов — один крупный прямоугольный блок позади кабины.
- Шасси — один тонкий горизонтальный прямоугольный блок под кабиной и кузовом.
- Четыре колеса — четыре кубических заменителя по бокам шасси, по два на ось; дальние
  могут быть скрыты ракурсом.
proportions:
- Длина примерно вдвое больше общей высоты; ширина немного меньше высоты.
- Кабина занимает примерно треть длины, кузов около двух третей.
- Между кабиной и кузовом небольшой читаемый зазор.
preserve:
- Компоновка с передней кабиной, задним кузовом и двумя осями.
avoid:
- Окна, бамперы, зеркала, ручки, решётки и круглые колёса на этом проходе.
